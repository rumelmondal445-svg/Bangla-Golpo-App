<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলা গল্প</title>
<style>
body{font-family:sans-serif;background:#fff8e8;margin:0;color:#333}
header{background:#087b55;color:white;text-align:center;padding:22px}
h1{margin:5px}
main{padding:15px}
input{width:95%;padding:12px;border:1px solid #ccc;border-radius:10px}
button{background:#087b55;color:white;border:0;padding:10px 14px;border-radius:8px;margin:5px}
.story{background:white;padding:14px;margin:12px 0;border-radius:12px;box-shadow:0 2px 6px #ddd}
#reader{background:white;padding:15px;border-radius:12px;white-space:pre-line}
</style>
</head>
<body>
<header>
<h1>📚 বাংলা গল্প</h1>
<p>গল্প পড়ুন, শুনুন ও শিখুন</p>
</header>
<main>
<input id="search" placeholder="গল্প খুঁজুন..." oninput="showStories()">
<div id="categories"></div>
<div id="stories"></div>
<div id="reader"></div>
</main>
<script>
const groups={
"শিশুদের গল্প":[
["সৎ কাঠুরে","এক কাঠুরে বনের পাশে থাকত। একদিন তার কুড়াল নদীতে পড়ে গেল। সে সত্য কথা বলল। তার সততার জন্য সে পুরস্কার পেল। শিক্ষা: সততা মহৎ গুণ।"],
["পিঁপড়ার পরিশ্রম","একটি পিঁপড়া প্রতিদিন খাবার জমাত। শীতকালে তার কষ্ট হয়নি। শিক্ষা: পরিশ্রম ভবিষ্যতে কাজে লাগে।"],
["খরগোশ ও কচ্ছপ","খরগোশ নিজের গতি নিয়ে অহংকার করত। কচ্ছপ ধীরে ধীরে এগিয়ে জিতে গেল। শিক্ষা: ধৈর্য ও চেষ্টা জরুরি।"],
["বুদ্ধিমান কাক","একটি কাক পাত্রে অল্প পানি পেল। সে ছোট ছোট পাথর ফেলল। পানি ওপরে উঠল। শিক্ষা: বুদ্ধি দিয়ে সমস্যার সমাধান হয়।"],
["বন্ধু দুই পাখি","দুই পাখি একসঙ্গে বাসা বানাত। বিপদে তারা একে অপরকে সাহায্য করত। শিক্ষা: বন্ধুত্বের মূল্য অনেক।"]
],
"ইসলামিক শিক্ষা":[
["সত্য কথা বলা","এক শিশু সব সময় সত্য বলত। সবাই তাকে বিশ্বাস করত। শিক্ষা: ইসলাম সত্যবাদিতা শেখায়।"],
["মায়ের সম্মান","এক শিশু মায়ের কাজে সাহায্য করত। মা তার জন্য দোয়া করতেন। শিক্ষা: বাবা-মাকে সম্মান করতে হয়।"],
["দান করার আনন্দ","এক শিশু নিজের খাবার অন্যের সঙ্গে ভাগ করল। শিক্ষা: দান করা ভালো কাজ।"],
["নামাজের শিক্ষা","এক পরিবার সময়মতো নামাজ পড়ত। তারা ভালো কাজ করার চেষ্টা করত। শিক্ষা: নামাজ গুরুত্বপূর্ণ ইবাদত।"],
["ক্ষমা","দুই বন্ধু ভুল বোঝাবুঝির পর একে অপরকে ক্ষমা করল। শিক্ষা: ক্ষমা মহৎ গুণ।"]
],
"নৈতিক শিক্ষা":[
["লোভের ফল","এক ব্যক্তি বেশি পাওয়ার লোভে নিজের জিনিসও হারাল। শিক্ষা: অতিরিক্ত লোভ ভালো নয়।"],
["সময়ের মূল্য","এক ছাত্র সময়মতো পড়াশোনা করত। সে ভালো ফল করল। শিক্ষা: সময়ের সদ্ব্যবহার জরুরি।"],
["উপকারের প্রতিদান","এক শিশু অসুস্থ বন্ধুকে সাহায্য করল। পরে বন্ধুটিও তাকে সাহায্য করল। শিক্ষা: উপকার কখনো বৃথা যায় না।"],
["ঐক্যের শক্তি","কয়েকজন বন্ধু একসঙ্গে কাজ করে কঠিন কাজ শেষ করল। শিক্ষা: ঐক্যে শক্তি।"],
["অহংকারের পতন","এক ব্যক্তি নিজের জ্ঞান নিয়ে অহংকার করত। পরে বুঝল শেখার শেষ নেই। শিক্ষা: বিনয়ী হও।"]
],
"রূপকথার গল্প":[
["জাদুর ফুল","এক রাজ্যে একটি জাদুর ফুল ছিল। ফুলটি সবার মনে আনন্দ ছড়াত।"],
["পরীর উপহার","এক সৎ মেয়ে এক পরীকে সাহায্য করল। পরী তাকে একটি জাদুর প্রদীপ দিল।"],
["সোনার পাখি","এক রাজপুত্র সোনার পাখির খোঁজে বের হলো। পথে সে অনেক ভালো কাজ করল।"],
["চাঁদের রাজ্য","এক শিশু স্বপ্নে চাঁদের রাজ্যে গিয়ে নতুন বন্ধু পেল।"],
["জাদুর বন","এক জাদুর বনে পশুপাখিরা একসঙ্গে বাস করত। তারা বনকে সুন্দর রাখত।"]
],
"পারিবারিক গল্প":[
["বাবার ভালোবাসা","বাবা প্রতিদিন পরিশ্রম করে পরিবারের যত্ন নিতেন।"],
["দাদির গল্প","দাদি নাতি-নাতনিদের সুন্দর সুন্দর গল্প শোনাতেন।"],
["ভাইবোনের বন্ধন","ভাইবোনেরা নিজেদের খেলনা ভাগ করে নিত।"],
["পরিবারের আনন্দ","এক পরিবার সবাই মিলে খাবার তৈরি করল।"],
["একসঙ্গে ঈদ","পরিবারের সবাই ঈদে একত্র হয়ে আনন্দ ভাগ করে নিল।"]
]
};
function showStories(){
let q=document.getElementById("search").value.toLowerCase();
let html="";
for(let cat in groups){
html+=`<h2>${cat}</h2>`;
groups[cat].forEach((s,i)=>{
if((s[0]+s[1]).toLowerCase().includes(q))
html+=`<div class="story"><h3>${s[0]}</h3><button onclick="readStory('${cat}',${i})">গল্প পড়ুন</button></div>`;
});
}
document.getElementById("stories").innerHTML=html;
}
function readStory(cat,i){
let s=groups[cat][i];
document.getElementById("reader").innerHTML=`<h2>${s[0]}</h2><p>${s[1]}</p><button onclick="speak()">গল্প শুনুন 🔊</button><button onclick="speechSynthesis.cancel()">বন্ধ করুন</button>`;
window.currentStory=s[1];
}
function speak(){
let u=new SpeechSynthesisUtterance(window.currentStory);
u.lang="bn-BD";
speechSynthesis.speak(u);
}
showStories();
</script>
</body>
</html>
